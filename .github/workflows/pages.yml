name: Deploy Pages (static)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel an in-progress deploy: the daily publish pushes 3 commits
# (mp3, json, feed) in quick succession; queue them instead of colliding.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Assemble static site (exclude VCS + CI, keep mp3s/feed/html)
        run: |
          mkdir -p _site
          rsync -a --exclude=".git" --exclude=".github" --exclude="_site" ./ _site/
          test -f _site/.nojekyll || touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
